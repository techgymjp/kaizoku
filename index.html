<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>瀬戸内の海賊王</title>
<meta name="description" content="源義経（あなた）、海賊となる。姫路港から巌流島へ——瀬戸内海の有人島を 3D で再現した海賊アクション。">
<meta property="og:title" content="瀬戸内の海賊王">
<meta property="og:description" content="姫路港から巌流島へ。島に上陸して財宝を奪い、海賊船を沈め、最後に平家の怨霊を討て。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#10202a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Yuji+Syuku&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23c0161b%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27%3E%E6%B5%B7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=35801">
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="tags"></div>
<div id="floats"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="pname"><span class="mon" title="笹竜胆"></span><span id="hudName">源義経</span> <small data-en="Pirate captain">海賊船の船長</small></div>
    <div class="bar"><div id="hpbar" class="fill hp"></div><span class="lbl"><span data-en="HP">体力</span> <b id="hpnum">300</b></span></div>
    <div class="bar sm"><div id="stbar" class="fill st"></div><span class="lbl" data-en="Dash">駆</span></div>
    <div id="seaHelp" class="help"></div>
  </div>
  <div class="hud-right">
    <div class="route"><div id="routebar"></div><span data-en="Himeji → Ganryūjima">姫路 → 巌流島</span></div>
    <div id="harborNav" class="pill hidden"><div id="navArrow">➤</div><div id="navName">-</div><div id="navInfo">-</div></div>
    <div class="hud-btns"><button id="btnView" class="mini-btn hidden" data-en="👁">視</button> <button id="btnPause" class="mini-btn" data-en="II">止</button></div>
    <!-- 数字の表示は読みにくいので出さない（結果画面で見せる） -->
    <div class="stats-hidden" hidden>
      <b id="hGold">0</b><b id="hIsl">0</b><b id="hSunk">0</b><b id="hKill">0</b><b id="hEsc">0</b>
      <div id="hPlace"></div><div id="hTide"></div><div id="hWind"></div>
    </div>
  </div>
  <canvas id="minimap" width="420" height="300"></canvas>
  <div id="landPrompt" class="hidden"></div>
  <div id="target" class="hidden"></div>
  <div id="crosshair" class="hidden"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="joyzone"></div>
  <div id="joybase"><div id="joyknob"></div></div>
  <div id="tbtns">
    <button id="btnSpear" class="tbtn spear" data-en="Spear">槍</button>
    <button id="btnSword" class="tbtn sword" data-en="Sword">刀</button>
    <button id="btnDash" class="tbtn dash" data-en="Dash">駆</button>
    <button id="btnLand" class="tbtn land" data-en="Land">上陸</button>
  </div>
</div>
<div id="msgs"></div>
<div id="banner"></div>

<!-- 読み込み -->
<div id="loading" class="screen">
  <div class="load-inner"><div class="spinner"></div><div id="loadtext">読み込み中……</div></div>
</div>

<!-- タイトル -->
<div id="title" class="screen hidden">
  <div class="title-inner">
    <div class="pre" data-en="From Himeji to Ganryūjima">姫路港より巌流島へ</div>
    <h1>瀬戸内の<br class="br-sp">海賊王</h1>
    <div class="title-sub" data-en="PIRATE KING OF THE SETO INLAND SEA"></div>
    <div class="name-row"><label for="nameInput" data-en="Your name">船長の名前</label><input id="nameInput" type="text" maxlength="14" autocomplete="off" spellcheck="false"><button id="nameReset" class="hidden" hidden></button></div>
    <button id="btnContinue" class="btn primary hidden" data-en="Continue">途中からはじめる</button>
    <button id="btnStart" class="btn primary" data-en="Set sail">出　航</button>
    <div class="lang-sel"><button class="lang-btn" data-lang="ja">日本語</button><button class="lang-btn" data-lang="en">English</button></div>
    <a id="btnHowto" class="btn ghost small howto" href="howto.html" target="_blank" rel="noopener" data-en="How to play">遊び方</a>
    <button id="btnMute" class="btn ghost small">音：入</button>
    <div class="legal">
      <span data-en="Terrain, aerial photos and buildings: processed from GSI Tiles (Geospatial Information Authority of Japan)">地形・空中写真・建物：国土地理院「地理院タイル」を加工して作成</span><br>
      <span data-en="Battle system, sound and character: based on “Kobayakawa: Lone Samurai” (TECH GYM)">戦い方・効果音・主人公：「孤軍奮闘小早川」（テックジム）より</span>
    </div>
  </div>
</div>

<!-- 一時停止 -->
<div id="pause" class="screen hidden">
  <div class="panel">
    <h2 data-en="Paused">船中休息</h2>
    <button id="btnResume" class="btn primary" data-en="Resume">再び出る</button>
    <button id="btnQuit" class="btn ghost" data-en="Back to title">タイトルへ</button>
    <a class="btn ghost" href="howto.html" target="_blank" rel="noopener" data-en="How to play">遊び方</a>
  </div>
</div>

<!-- 結果 -->
<div id="result" class="screen hidden">
  <div class="panel result">
    <div class="r-pre" data-en="Pirate King of the Seto Inland Sea — Results">瀬戸内の海賊王　戦果</div>
    <h2 id="rHead">討　死</h2>
    <div id="rPlace" class="r-place"></div>
    <div id="rTitle" class="r-title"></div>
    <table class="r-stats">
      <tr><th data-en="Gold">財宝</th><td id="rGold"></td></tr>
      <tr><th data-en="Islands raided">奪った島</th><td id="rIsl"></td></tr>
      <tr><th data-en="Ships sunk">撃沈した船</th><td id="rSunk"></td></tr>
      <tr><th data-en="Foes slain">斬った敵</th><td id="rKill"></td></tr>
      <tr><th data-en="Voyage">航海</th><td id="rProg"></td></tr>
      <tr><th data-en="Time">時間</th><td id="rTime"></td></tr>
    </table>
    <div id="rList" class="r-list"></div>
    <div class="share">
      <button id="shareX" class="btn share-x" data-en="Share on 𝕏">𝕏 でシェア</button>
      <button id="shareLine" class="btn share-line" data-en="LINE">LINEで送る</button>
    </div>
    <div class="r-btns">
      <button id="btnRetry" class="btn primary" data-en="Sail again">再び出航</button>
      <button id="btnTitle" class="btn ghost" data-en="Title">タイトルへ</button>
    </div>
  </div>
</div>

<script>
  // 公開した版の番号（version.txt）を毎回確かめてから読み込む。古いファイルが残らないように
  fetch('version.txt', { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).catch(() => '').then((v) => {
    const s = document.createElement('script'); s.type = 'module'; s.src = 'js/main.js?v=' + (v.trim() || Date.now()); document.body.appendChild(s);
  });
</script>
</body>
</html>
